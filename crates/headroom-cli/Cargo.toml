[package]
name = "headroom-cli"
description = "The headroom command-line interface."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "headroom"
path = "src/main.rs"

[dependencies]
headroom-core.workspace = true
anyhow.workspace = true
tracing.workspace = true
clap.workspace = true
serde_json.workspace = true
headroom-mcp = { path = "../headroom-mcp" }

[dev-dependencies]
# Test-only, so the config template can be checked against the proxy's real
# `STARTUP_ONLY` list rather than a copy of it. A copy is how the template and the code
# drift apart, which is the bug the test exists to prevent.
headroom-proxy = { path = "../headroom-proxy" }
