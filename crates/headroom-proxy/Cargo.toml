[package]
name = "headroom-proxy"
description = "Byte-faithful compressing reverse proxy for LLM provider APIs."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "headroom-proxy"
path = "src/main.rs"

[dependencies]
headroom-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
bytes.workspace = true
axum.workspace = true
tokio.workspace = true
tower.workspace = true
http.workspace = true
reqwest.workspace = true
futures-core = "0.3"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3.33", default-features = false, features = ["sink"] }
# Same rusqlite version `remind_me_core` depends on, deliberately — a `Connection` this
# crate opens is passed straight into `remind_me_core::db::queries`, and a mismatched
# version would make that a *different type* even though both are named `Connection`,
# the same "expected Model, found Model" hazard `remind_me_core`'s own Cargo.toml
# records for `ocrs`/`rten`.
rusqlite = { version = "0.31", optional = true }
# `rusty_remind_me`'s `remind_me_core`, pinned to the merge commit of "Let a caller
# supply the embedder to search_memories" (baileyrd/rusty_remind_me#188, merged as
# 9fbc391), now on `main` — see DECISIONS D44. Pinned to that merge commit rather than
# `main`'s later tip so this dependency tracks exactly the PR that added the seam it
# needs, not whatever unrelated work has landed on `main` since.
remind_me_core = { git = "https://github.com/baileyrd/rusty_remind_me", rev = "9fbc391dfa72b4103bc437b48ae451b9d7bfa937", optional = true, default-features = false }
headroom-embed = { path = "../headroom-embed", optional = true }

[dev-dependencies]
headroom-core = { workspace = true }
sha2 = "0.10"
headroom-simulators = { path = "../headroom-simulators" }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1.19"

[features]
# Forwards `headroom-core`'s Redis-backed CCR store (gap row R4). Off by default; see
# DECISIONS D22.
redis = ["headroom-core/redis"]
# Linked, in-process query against a `rusty_remind_me` memory store (gap #215; see
# DECISIONS D44). Off by default: it adds `remind_me_core` — `tokio` with `full` and
# `rusqlite` with `bundled` (SQLite compiled from source) among its own dependencies —
# plus `rten` + `tokenizers` for the in-process embedder. Build cost is measured, not
# estimated, in D44.
linked-memory = [
    "dep:remind_me_core",
    "dep:headroom-embed",
    "dep:rusqlite",
    "headroom-embed/local",
]
