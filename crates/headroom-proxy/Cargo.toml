[package]
name = "headroom-proxy"
description = "Byte-faithful compressing reverse proxy for LLM provider APIs."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "headroom-proxy"
path = "src/main.rs"

[dependencies]
headroom-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
bytes.workspace = true
axum.workspace = true
tokio.workspace = true
tower.workspace = true
http.workspace = true
reqwest.workspace = true
futures-core = "0.3"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3.33", default-features = false, features = ["sink"] }

[dev-dependencies]
headroom-core = { workspace = true }
sha2 = "0.10"
headroom-simulators = { path = "../headroom-simulators" }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1.19"

[features]
# Forwards `headroom-core`'s Redis-backed CCR store (gap row R4). Off by default; see
# DECISIONS D22.
redis = ["headroom-core/redis"]
