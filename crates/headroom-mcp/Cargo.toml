[package]
name = "headroom-mcp"
description = "MCP server exposing headroom_compress, headroom_retrieve, and headroom_stats."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "headroom-mcp"
path = "src/main.rs"

[dependencies]
headroom-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
bytes.workspace = true

[features]
# Forwards `headroom-core`'s Redis-backed CCR store (gap row R4). This binary is the
# retrieval half, so a shared store matters here whenever the proxy uses one.
redis = ["headroom-core/redis"]
