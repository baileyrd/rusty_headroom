name: CI

# Runs on every PR and on pushes to the default branch. The "on green CI, merge"
# rule depends on this workflow being the required status check — set it as required
# under branch protection (see references/ci-and-branch-protection.md).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup component add rustfmt clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        # Warnings fail the build, matching the "no unwrap/expect outside tests,
        # clippy clean" standard.
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

  # The Python bindings, in their own job. The Rust job above runs against
  # `default-members`, which excludes `headroom-py` so the everyday loop needs no Python
  # toolchain — but that also means nothing there ever builds the extension module.
  # Gap rows B1 and B2 are only meaningfully "done" if a wheel builds and imports, so
  # that is what this checks.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The floor `abi3-py310` builds against. A wheel built here imports on every
          # later interpreter too, which is the whole point of the stable ABI.
          python-version: "3.10"

      - name: Install maturin and pytest
        run: pip install maturin pytest

      - name: Build and install the wheel
        working-directory: crates/headroom-py
        run: |
          maturin build --release --out dist
          pip install --force-reinstall dist/*.whl

      - name: Test
        working-directory: crates/headroom-py
        run: pytest tests -q

  # The Redis-backed CCR store (gap row R4). Its own job with a real server, because the
  # `redis` feature is off by default and the store's tests skip when nothing answers —
  # so without this, "it compiles" would be the only thing ever checked.
  redis:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        # Without a health check the job can start before the server accepts
        # connections, and the tests would skip rather than fail — passing while
        # proving nothing.
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup component add clippy

      - name: Confirm the server is actually up
        # The skip-when-absent behaviour means a broken service container would look
        # like a pass. This makes that a failure instead.
        run: |
          sudo apt-get install -y redis-tools
          redis-cli -h 127.0.0.1 -p 6379 ping

      - name: Clippy
        run: cargo clippy -p headroom-core -p headroom-proxy -p headroom-mcp --features redis --all-targets -- -D warnings

      - name: Test
        env:
          HEADROOM_REDIS_URL: redis://127.0.0.1:6379
        run: cargo test -p headroom-core --features redis
